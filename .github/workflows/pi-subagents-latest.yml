name: pi-subagents latest compatibility (drift, non-blocking)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  latest:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm install --no-save pi-subagents@latest
      - run: npm run check
      - run: npm test
